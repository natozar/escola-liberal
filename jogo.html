<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="twitter:title" content="Cidade Livre — o jogo da Escola Liberal">
<meta name="twitter:description" content="Governe uma cidade brasileira. Resista às promessas fáceis — ou caia nelas e pague a conta. Grátis, offline, 18+.">
<meta name="twitter:image" content="https://escolaliberal.com.br/assets/jogo/og-card.jpg">
<style>
  :root{
    --bg:#0b0d13; --bg-2:#0f1219;
    --painel:rgba(255,255,255,.035); --painel-2:rgba(255,255,255,.06);
    --borda:rgba(255,255,255,.075); --borda-forte:rgba(255,255,255,.14);
    --tinta:#f2eee4; --tinta-2:#a9a3b5; --tinta-3:#6e6980;
    --ouro:#e8b04b; --ouro-2:#c9902e; --verde:#57c78e; --vermelho:#e56b62;
    --azul:#7a9fd4; --lucidez:#6ed6d0;
    --r:16px; --r-lg:20px;
    --sombra:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.28);
    --ease:cubic-bezier(.22,.9,.28,1);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  html{color-scheme:dark}
  body{
    background:var(--bg); color:var(--tinta);
    font-family:"Segoe UI Variable Display","Segoe UI",system-ui,-apple-system,"SF Pro Text",sans-serif;
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
    display:flex; justify-content:center; position:relative;
  }
  body::before{
    content:''; position:fixed; inset:0; pointer-events:none; z-index:0;
    background:
      radial-gradient(60% 42% at 18% -6%, rgba(122,159,212,.10), transparent 60%),
      radial-gradient(52% 38% at 88% 4%, rgba(232,176,75,.07), transparent 62%),
      radial-gradient(70% 60% at 50% 110%, rgba(110,214,208,.05), transparent 55%);
  }
  #app{
    width:100%; max-width:530px; min-height:100dvh; position:relative; z-index:1;
    display:flex; flex-direction:column;
    padding:14px 16px calc(16px + env(safe-area-inset-bottom));
    gap:11px;
  }

  /* ---------- medidores ---------- */
  .medidores{display:flex; gap:9px; flex-wrap:wrap}
  .medidor{
    flex:1; min-width:104px;
    background:var(--painel); border:1px solid var(--borda);
    border-radius:var(--r); padding:9px 12px 10px;
    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.04);
    transition:border-color .3s;
  }
  .medidor .rotulo{font-size:10px; letter-spacing:.13em; text-transform:uppercase; font-weight:600; color:var(--tinta-3); display:flex; justify-content:space-between; align-items:baseline}
  .medidor .valor{font-size:16.5px; font-weight:700; font-variant-numeric:tabular-nums; margin-top:3px; letter-spacing:-.01em}
  .barra{height:4px; background:rgba(0,0,0,.45); border-radius:99px; margin-top:7px; overflow:hidden}
  .barra i{display:block; height:100%; border-radius:99px; transition:width .65s var(--ease), background .65s}
  .medidor.oculto{display:none}
  .delta{font-size:10.5px; font-weight:700; font-variant-numeric:tabular-nums; padding:1px 6px; border-radius:99px}
  .delta.pos{color:var(--verde); background:rgba(87,199,142,.12)}
  .delta.neg{color:var(--vermelho); background:rgba(229,107,98,.12)}

  /* ---------- cidade ---------- */
  .cidade{
    background:var(--painel); border:1px solid var(--borda); border-radius:var(--r-lg);
    padding:12px 14px 9px; backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.04);
  }
  .cidade .skyline{display:flex; gap:7px; align-items:flex-end; justify-content:space-between}
  .predio{
    flex:1; border-radius:10px 10px 3px 3px; text-align:center;
    display:flex; flex-direction:column; justify-content:flex-end; align-items:center;
    font-size:19px; padding-bottom:4px; position:relative;
    background:linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.02));
    border:1px solid var(--borda); border-bottom:none;
    transition:background .8s, opacity .8s, filter .8s, height .8s var(--ease);
  }
  .predio small{font-size:8.5px; color:var(--tinta-3); letter-spacing:.05em; line-height:1.15; padding-bottom:2px; font-weight:600}
  .predio .tag{
    position:absolute; top:-9px; left:50%; transform:translateX(-50%) rotate(-4deg);
    background:#f2ead9; color:#8a3d2e; font-size:8px; font-weight:800; letter-spacing:.06em;
    padding:1.5px 6px; border-radius:3px; opacity:0; transition:opacity .5s; white-space:nowrap;
    box-shadow:0 2px 6px rgba(0,0,0,.4);
  }
  .predio.fechado .tag{opacity:1}
  .predio.fechado{filter:grayscale(.9) brightness(.55)}
  .cidade.estado-prospero .predio{background:linear-gradient(180deg, rgba(87,199,142,.14), rgba(87,199,142,.04))}
  .cidade.estado-alerta   .predio{background:linear-gradient(180deg, rgba(232,176,75,.13), rgba(232,176,75,.04))}
  .cidade.estado-crise    .predio{background:linear-gradient(180deg, rgba(229,107,98,.14), rgba(229,107,98,.04))}
  .fila{font-size:11px; letter-spacing:-2px; height:14px; overflow:hidden; transition:opacity .6s}
  .rodape-cidade{display:flex; justify-content:space-between; margin-top:9px; font-size:11px; color:var(--tinta-3); font-variant-numeric:tabular-nums}

  /* ---------- cidade-fantasma do vizinho: horizonte 3D (CSS transforms, zero WebGL) ---------- */
  .horizonte{
    position:relative; height:88px; margin:0 0 10px; border-radius:12px; overflow:hidden;
    perspective:480px; perspective-origin:50% 92%;
    background:linear-gradient(180deg, rgba(122,159,212,.06), rgba(126,200,201,.03) 55%, transparent);
    border:1px solid rgba(126,200,201,.10);
  }
  .horizonte .cena{
    position:absolute; inset:0; transform-style:preserve-3d;
    animation:fantasma-surge 1.4s ease-out, horizonte-drift 16s ease-in-out infinite alternate;
  }
  @keyframes fantasma-surge{ from{opacity:0; filter:blur(7px)} to{opacity:1; filter:blur(0)} }
  @keyframes horizonte-drift{ from{transform:rotateY(-5deg)} to{transform:rotateY(5deg)} }
  .fpredio{ position:absolute; bottom:8px; transform-style:preserve-3d }
  .fpredio .face{
    position:absolute; left:0; bottom:0; width:100%; height:100%; display:block;
    background:linear-gradient(180deg, rgba(126,200,201,.20), rgba(126,200,201,.05));
    border:1px solid rgba(126,200,201,.30); border-bottom:none;
  }
  .fpredio .frente.janelas{
    background-image:radial-gradient(rgba(232,196,120,.55) 1px, transparent 1.5px);
    background-size:7px 9px; background-position:2px 4px;
  }
  .fpredio .lado{ transform-origin:left; background:rgba(126,200,201,.07) }
  .fpredio .topo{ top:0; bottom:auto; transform-origin:top; background:rgba(126,200,201,.15); border-bottom:1px solid rgba(126,200,201,.30) }
  .horizonte .neblina{ position:absolute; left:0; right:0; bottom:0; height:26px; z-index:2; pointer-events:none;
    background:linear-gradient(180deg, transparent, rgba(8,10,16,.55)) }
  .fantasma-tag{
    position:absolute; top:6px; left:9px; z-index:3; cursor:pointer;
    font:inherit; font-size:10.5px; font-weight:600; letter-spacing:.04em; color:rgba(196,224,226,.9);
    background:rgba(9,13,20,.5); border:1px solid rgba(126,200,201,.28); border-radius:999px; padding:3.5px 10px;
    backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px);
  }
  .fantasma-tag:hover{ background:rgba(14,20,30,.7) }

  /* ---------- momentos visuais ---------- */
  .momento{
    border-radius:14px; overflow:hidden; background:#07080c;
    border:1px solid var(--borda-forte); box-shadow:var(--sombra);
  }
  .momento img{width:100%; display:block; aspect-ratio:16/9; object-fit:cover;
    animation:kenburns 7s var(--ease) both}
  @keyframes kenburns{from{transform:scale(1.045)} to{transform:scale(1)}}
  .momento .fallback{
    aspect-ratio:16/9; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:8px; font-size:42px; letter-spacing:2px;
    background:radial-gradient(120% 90% at 50% 8%, #232030 0%, #0d0c14 70%);
  }
  .momento .fallback span{font-size:10px; letter-spacing:.1em; color:var(--tinta-3); text-transform:uppercase; font-weight:600}
  .momento.tem-img .fallback{display:none}
  .momento figcaption{
    font-size:11.5px; color:var(--tinta-2); padding:8px 12px; text-align:center;
    font-family:Georgia,serif; font-style:italic; letter-spacing:.01em;
    background:rgba(255,255,255,.025); border-top:1px solid var(--borda);
  }

  /* ---------- noticiário ---------- */
  .noticias{min-height:38px; display:flex; flex-direction:column; gap:5px}
  .noticia{
    font-size:12.5px; line-height:1.45; color:var(--tinta-2);
    background:var(--painel); border:1px solid var(--borda); border-left:3px solid var(--ouro);
    border-radius:4px 12px 12px 4px; padding:7px 12px;
    backdrop-filter:blur(10px); animation:entrar .5s var(--ease);
  }
  .noticia.ruim{border-left-color:var(--vermelho)}
  .noticia.boa{border-left-color:var(--verde)}
  @keyframes entrar{from{opacity:0; transform:translateY(7px)} to{opacity:1; transform:none}}

  /* ---------- carta ---------- */
  .carta{
    flex:1; display:flex; flex-direction:column;
    background:linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.022) 30%);
    border:1px solid var(--borda-forte); border-radius:var(--r-lg);
    padding:20px 20px 18px; gap:13px;
    box-shadow:var(--sombra), inset 0 1px 0 rgba(255,255,255,.06);
    backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
    animation:cartaIn .45s var(--ease);
  }
  @keyframes cartaIn{from{opacity:0; transform:translateY(16px) scale(.985)} to{opacity:1; transform:none}}
  .carta .quem{
    font-size:10.5px; letter-spacing:.18em; text-transform:uppercase; font-weight:700; color:var(--tinta-3);
  }
  .carta.prometedor{border-color:rgba(232,176,75,.32);
    background:linear-gradient(180deg, rgba(232,176,75,.10), rgba(255,255,255,.022) 42%)}
  .carta.prometedor .quem{color:var(--ouro)}
  .carta.crise{border-color:rgba(229,107,98,.36);
    background:linear-gradient(180deg, rgba(229,107,98,.11), rgba(255,255,255,.022) 42%)}
  .carta.crise .quem{color:var(--vermelho)}
  .carta.aula-carta{border-color:rgba(110,214,208,.32);
    background:linear-gradient(180deg, rgba(110,214,208,.08), rgba(255,255,255,.022) 42%)}
  .carta.aula-carta .quem{color:var(--lucidez)}
  .carta h2{font-size:21px; font-weight:750; line-height:1.22; letter-spacing:-.015em; text-wrap:balance}
  .carta p{font-size:14.5px; line-height:1.6; color:var(--tinta-2)}
  .opcoes{margin-top:auto; display:flex; flex-direction:column; gap:9px}
  .opcao{
    font:inherit; text-align:left; cursor:pointer; position:relative;
    background:var(--painel-2); color:var(--tinta);
    border:1px solid var(--borda-forte); border-radius:14px; padding:13px 16px;
    font-size:14.5px; line-height:1.42; font-weight:550;
    transition:border-color .18s, background .18s, transform .12s var(--ease), box-shadow .18s;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.05);
  }
  .opcao:hover{border-color:rgba(232,176,75,.55); background:rgba(255,255,255,.085); transform:translateY(-1px);
    box-shadow:0 4px 16px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.06)}
  .opcao:active{transform:translateY(0) scale(.988)}
  .opcao:focus-visible{outline:2px solid var(--ouro); outline-offset:2px}
  .opcao .custo{display:block; font-size:11.5px; font-weight:450; color:var(--tinta-3); margin-top:3.5px; letter-spacing:.01em}
  .opcao[disabled]{opacity:.4; cursor:not-allowed}
  .opcao[disabled]:hover{border-color:var(--borda-forte); background:var(--painel-2); transform:none; box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
  .opcao.destaque{border-color:rgba(110,214,208,.55);
    background:linear-gradient(180deg, rgba(110,214,208,.13), rgba(110,214,208,.05))}
  .opcao.destaque:hover{border-color:var(--lucidez)}

  /* ---------- aula ---------- */
  .aula-conteudo{
    font-family:Georgia,"Times New Roman",serif;
    font-size:15px; line-height:1.68; color:var(--tinta-2);
    display:flex; flex-direction:column; gap:12px; overflow-y:auto;
  }
  .aula-conteudo strong{color:var(--tinta); font-weight:650}
  .quiz{font-family:"Segoe UI Variable Display","Segoe UI",system-ui,sans-serif}
  .quiz p{font-weight:650; color:var(--tinta); margin-bottom:7px; font-size:14.5px}
  .quiz .opcao{margin-bottom:7px; font-size:14px}
  .quiz .opcao.certa{border-color:var(--verde); background:rgba(87,199,142,.13)}
  .quiz .opcao.errada{border-color:var(--vermelho); background:rgba(229,107,98,.12)}

  /* ---------- fim ---------- */
  .selo{
    align-self:center; text-align:center; position:relative; overflow:hidden;
    border:1.5px solid rgba(232,176,75,.6); border-radius:18px;
    padding:18px 30px; margin:8px 0;
    background:linear-gradient(180deg, rgba(232,176,75,.12), rgba(232,176,75,.03));
    box-shadow:0 0 40px -8px rgba(232,176,75,.25), var(--sombra);
  }
  .selo::after{
    content:''; position:absolute; top:-60%; left:-80%; width:60%; height:220%;
    background:linear-gradient(105deg, transparent, rgba(255,240,200,.16), transparent);
    transform:rotate(8deg); animation:brilho 3.2s var(--ease) infinite;
  }
  @keyframes brilho{0%,55%{left:-80%} 90%,100%{left:130%}}
  .selo .nome{font-size:18px; font-weight:800; letter-spacing:-.01em;
    background:linear-gradient(180deg, #f4cf7e, var(--ouro-2));
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent}
  .selo .desc{font-size:12.5px; color:var(--tinta-2); margin-top:4px; max-width:300px}
  .recap{font-size:13px; color:var(--tinta-2); line-height:1.75; font-variant-numeric:tabular-nums}
  .recap b{color:var(--tinta)}

  .rodape{display:flex; justify-content:space-between; align-items:center; font-size:11px; color:var(--tinta-3)}
  .rodape a{color:inherit;text-decoration:none;transition:color .2s}
  .rodape a:hover{color:var(--tinta-2)}
  .rodape button{
    font:inherit; font-size:11px; color:var(--tinta-3); background:none;
    border:1px solid var(--borda); border-radius:99px; padding:5px 12px; cursor:pointer;
    transition:color .2s, border-color .2s;
  }
  .rodape button:hover{color:var(--tinta); border-color:var(--borda-forte)}
  /* ---------- lotes administráveis ---------- */
  .cidade .skyline{display:grid; grid-template-columns:repeat(4,1fr); gap:7px; align-items:stretch}
  .predio.lote{
    font:inherit; font-size:19px; cursor:pointer; min-height:62px;
    display:flex; flex-direction:column; justify-content:flex-end; align-items:center;
    padding:14px 2px 4px; border-radius:12px; border-bottom:1px solid var(--borda);
    transition:transform .12s var(--ease), border-color .2s, background .3s;
  }
  .predio.lote:hover{transform:translateY(-2px); border-color:rgba(232,176,75,.5)}
  .predio.lote:active{transform:scale(.96)}
  .predio.lote:focus-visible{outline:2px solid var(--ouro); outline-offset:2px}
  .predio.lote.ruim{border-color:rgba(229,107,98,.5); background:linear-gradient(180deg, rgba(229,107,98,.16), rgba(229,107,98,.05))!important}
  .predio.lote.obra{border-color:rgba(232,176,75,.5)}
  .lote-badge{
    position:absolute; top:4px; right:5px; font-size:9.5px; font-weight:800;
    color:var(--ouro); letter-spacing:.02em;
  }
  .lote-badge.ruim{animation:pulsar 1.2s ease-in-out infinite}
  @keyframes pulsar{0%,100%{opacity:1} 50%{opacity:.35}}

  /* ---------- a cidade viva: obra, inauguração, crescimento ---------- */
  .predio.lote.obra{overflow:hidden}
  .predio.lote.obra .operario{
    position:absolute; top:2px; left:4px; font-size:13px;
    animation:trabalhar 1s ease-in-out infinite;
  }
  @keyframes trabalhar{0%,100%{transform:translateY(0) rotate(-6deg)} 50%{transform:translateY(-3px) rotate(8deg)}}
  .obra-barra{
    position:absolute; bottom:0; left:0; height:3px; background:var(--ouro);
    box-shadow:0 0 8px var(--ouro); transition:width .8s var(--ease); border-radius:0 2px 0 0;
  }
  .predio.lote.inaugura{animation:inaugurar .9s var(--ease)}
  @keyframes inaugurar{
    0%{transform:scale(1)} 35%{transform:scale(1.18); box-shadow:0 0 0 3px rgba(232,176,75,.7), 0 0 30px rgba(232,176,75,.5)}
    100%{transform:scale(1)}
  }
  .predio.lote.revela{animation:revelar .8s var(--ease) both}
  @keyframes revelar{
    from{transform:scale(.3) rotate(-6deg); opacity:0}
    60%{transform:scale(1.12)}
    to{transform:scale(1); opacity:1}
  }
  .flut{
    position:absolute; z-index:40; font-size:12.5px; font-weight:800; pointer-events:none;
    text-shadow:0 1px 6px rgba(0,0,0,.7); animation:flutuar 1.5s var(--ease) both;
    white-space:nowrap;
  }
  .flut.pos{color:var(--verde)} .flut.neg{color:var(--vermelho)} .flut.ouro{color:var(--ouro)}
  @keyframes flutuar{
    0%{transform:translateY(0); opacity:0} 15%{opacity:1}
    100%{transform:translateY(-42px); opacity:0}
  }
  .confete{
    position:absolute; z-index:41; width:6px; height:6px; border-radius:1px; pointer-events:none;
    animation:cairConfete 1s var(--ease) both;
  }
  @keyframes cairConfete{
    0%{transform:translate(0,0) rotate(0); opacity:1}
    100%{transform:translate(var(--cx), var(--cy)) rotate(280deg); opacity:0}
  }

  /* ---------- painel do lote (bottom sheet) ---------- */
  #loteSheet{position:fixed; inset:0; z-index:60}
  #loteSheet .ls-pano{position:absolute; inset:0; background:rgba(5,6,10,.6); backdrop-filter:blur(3px)}
  #loteSheet .ls-caixa{
    position:absolute; left:50%; bottom:0; transform:translateX(-50%);
    width:100%; max-width:530px;
    background:linear-gradient(180deg, #1c2029, #14161d);
    border:1px solid var(--borda-forte); border-bottom:none;
    border-radius:20px 20px 0 0; padding:18px 18px calc(18px + env(safe-area-inset-bottom));
    box-shadow:0 -12px 48px rgba(0,0,0,.5);
    animation:subirSheet .3s var(--ease);
  }
  @keyframes subirSheet{from{transform:translate(-50%,30px); opacity:0} to{transform:translate(-50%,0); opacity:1}}
  #loteSheet .ls-tit{font-size:16px; font-weight:750; margin-bottom:12px; letter-spacing:-.01em}

  /* ---------- suco ---------- */
  @keyframes tremer{
    0%,100%{transform:none} 15%{transform:translate(-6px,2px) rotate(-.4deg)}
    30%{transform:translate(5px,-2px) rotate(.4deg)} 45%{transform:translate(-4px,1px)}
    60%{transform:translate(3px,-1px)} 75%{transform:translate(-2px,1px)}
  }
  #app.shake{animation:tremer .5s var(--ease)}
  @media (prefers-reduced-motion: reduce){ *{animation:none!important; transition:none!important} }
</style>
</head>
<body>

<div id="app">
  <div class="medidores" id="medidores"></div>

  <div class="cidade" id="cidade">
    <div class="horizonte" id="horizonte" hidden></div>
    <div class="skyline" id="skyline"></div>
    <div class="rodape-cidade">
      <span id="populacao"></span>
      <span id="semana"></span>
    </div>
  </div>

  <div class="noticias" id="noticias"></div>

  <div class="carta" id="carta"></div>

  <div class="rodape">
    <a href="https://escolaliberal.com.br/app.html">← Escola Liberal</a>
    <span>
      <button id="btnSfx" type="button" aria-label="Som"></button>
      <button id="btnReiniciar" type="button">Recomeçar</button>
    </span>
  </div>
</div>

<script>

const META_KEY = "escola_jogo_meta_v1";

/* PRNG determinística (mulberry32) — pronta p/ duelos por seed */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

/* ---------- meta-progressão (persiste entre partidas) ---------- */
function carregarMeta(){
  try{ const m = JSON.parse(localStorage.getItem(META_KEY)||'{}');
       return {campanhaVencida:false, melhorScore:0, runs:0, ...m}; }
  catch(e){ return {campanhaVencida:false, melhorScore:0, runs:0}; }
}
let META = carregarMeta();
// retro-conquistas: recorde antigo destrava o que merecia
if(META.melhorScore>=20 && !META.sobreviveu20) META.sobreviveu20 = true;

/* seed da semana: todo mundo joga a mesma cidade — ranking comparável */
function seedDaSemana(){
  const agora = new Date();
  const jan1 = new Date(agora.getFullYear(),0,1);
  const semanaISO = Math.ceil((((agora-jan1)/864e5)+jan1.getDay()+1)/7);
  return agora.getFullYear()*100 + semanaISO;
}

/* ---------- suco: som sintetizado + tremida de tela ---------- */
let _audio = null;
function sfx(tipo){
  try{
    if(localStorage.getItem("jogo_sfx")==="off") return;
    _audio = _audio || new (window.AudioContext||window.webkitAudioContext)();
    const notas = { click:[[520,.05]], ding:[[660,.09],[880,.12]], crise:[[196,.18],[147,.22]],
                    gameover:[[220,.15],[165,.2],[110,.3]], recorde:[[523,.1],[659,.1],[784,.1],[1047,.2]] };
    let t = _audio.currentTime;
    for(const [freq,dur] of (notas[tipo]||notas.click)){
      const o = _audio.createOscillator(), g = _audio.createGain();
      o.type = tipo==="crise"||tipo==="gameover" ? "sawtooth" : "sine";
      o.frequency.value = freq;
      g.gain.setValueAtTime(.12, t); g.gain.exponentialRampToValueAtTime(.001, t+dur);
      o.connect(g); g.connect(_audio.destination);
      o.start(t); o.stop(t+dur); t += dur*.9;
    }
  }catch(e){}
}
function doShake(){
  const app = document.getElementById("app");
  if(!app) return;
  app.classList.remove("shake"); void app.offsetWidth; app.classList.add("shake");
  if(navigator.vibrate) navigator.vibrate([60,40,60]);
}
/* número flutuante saindo de um elemento (operar e VER o retorno) */
function flutuarDe(el, texto, tipo){
  if(!el) return;
  const r = el.getBoundingClientRect();
  const s = document.createElement("span");
  s.className = "flut " + (tipo||"pos");
  s.textContent = texto;
  s.style.position = "fixed";
  s.style.left = (r.left + r.width/2 - 14 + (Math.random()*16-8)) + "px";
  s.style.top  = (r.top + r.height*0.25) + "px";
  document.body.appendChild(s);
  setTimeout(()=>s.remove(), 1600);
}
function confetarEm(el){
  if(!el) return;
  const r = el.getBoundingClientRect();
  const cores = ["#e8b04b","#57c78e","#6ed6d0","#e56b62","#7a9fd4"];
  for(let i=0;i<8;i++){
    const c = document.createElement("span");
    c.className = "confete";
    c.style.position = "fixed";
    c.style.left = (r.left + r.width/2) + "px";
    c.style.top  = (r.top + r.height/2) + "px";
    c.style.background = cores[i%cores.length];
    c.style.setProperty("--cx", (Math.random()*70-35)+"px");
    c.style.setProperty("--cy", (Math.random()*-55-15)+"px");
    document.body.appendChild(c);
    setTimeout(()=>c.remove(), 1100);
  }
}

/* ---------- ranking online (PostgREST direto — sem SDK) ---------- */
const RANK_URL = "https://hwjplecfqsckfiwxiedo.supabase.co/rest/v1/jogo_scores";

function nickLimpo(v){ return String(v||"").replace(/[<>&"']/g,"").trim().slice(0,20); }
async function enviarScore(sc){

         localStorage.setItem("jogo_rank_fila", JSON.stringify(q.slice(-10))); }catch(_){}

async function buscarRanking(seed){

  for(const l of linhas) if(!melhor.has(l.player_id)) melhor.set(l.player_id, l);
  return [...melhor.values()].slice(0, 10);
}

/* ---------- duelo P2P por link: o convite carrega tudo, zero servidor ---------- */
function codificarDuelo(o){
  try{ return btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""); }
  catch(e){ return ""; }
}
function decodificarDuelo(t){
  try{
    const j = JSON.parse(decodeURIComponent(escape(atob(String(t).replace(/-/g,"+").replace(/_/g,"/")))));
    const cen = CENARIOS.find(c=>c.id===j.c);
    const seed = Math.floor(+j.s), score = Math.floor(+j.p);
    if(!cen || !(seed>0) || !(score>=0) || score>999) return null;
    // snapshot opcional da cidade do desafiante (cidade-fantasma no horizonte)
    const r = j.r==null? null : Math.max(0, Math.min(100, Math.floor(+j.r)||0));
    const b = j.b==null? null : Math.max(0, Math.min(14,  Math.floor(+j.b)||0));
    return { s:seed, c:cen.id, p:score, n:nickLimpo(j.n)||"Um prefeito", r, b };
  }catch(e){ return null; }
}
function linkDuelo(d){ return "https://jogo.escolaliberal.com.br/jogo.html?duelo=" + codificarDuelo(d); }
let DUELO_PENDENTE = null;
try{
  const _qs = new URLSearchParams(location.search);
  if(_qs.get("duelo")){
    const d = decodificarDuelo(_qs.get("duelo"));
    if(d){
      localStorage.setItem("jogo_duelo_pendente", JSON.stringify(d));
      // a cidade de quem te desafiou vira sua vizinha no horizonte — mesmo se você recusar o duelo
      localStorage.setItem("jogo_vizinho", JSON.stringify({ n:d.n, p:d.p, r:d.r, b:d.b, em:Date.now() }));
    }
    history.replaceState(null, "", location.pathname); // limpa a URL; o convite sobrevive a reloads via localStorage
  }
  const _mem = JSON.parse(localStorage.getItem("jogo_duelo_pendente")||"null");
  DUELO_PENDENTE = (_mem && CENARIOS.find(c=>c.id===_mem.c) && Math.floor(+_mem.s)>0 && Math.floor(+_mem.p)>=0 && Math.floor(+_mem.p)<=999)
    ? { s:Math.floor(+_mem.s), c:_mem.c, p:Math.floor(+_mem.p), n:nickLimpo(_mem.n)||"Um prefeito" } : null;
}catch(e){ DUELO_PENDENTE = null; }
function descartarDuelo(){ try{ localStorage.removeItem("jogo_duelo_pendente"); }catch(e){} DUELO_PENDENTE = null; }
function iniciarDuelo(d){
  const cen = CENARIOS.find(c=>c.id===d.c) || CENARIOS[0];
  S = estadoInicial();
  S.modo = "vitalicio";
  S.seed = d.s;               // a MESMA cidade do desafiante — mesmas cartas, mesma semana
  S.flags.viuCapa = true;
  S.cenario = cen.id;         // duelo destrava o cenário só para esta run
  if(cen.tick) S.cenarioTick = cen.tick;
  S.duelo = { nick:d.n, score:d.p, r:d.r, b:d.b };
  S._rng = null;
  aplicar(cen.mods||{});
  META.runs++; salvarMeta();
  descartarDuelo();
  noticia(`⚔️ Duelo aceito: supere as ${d.p} semanas de ${d.n} na ${cen.emoji} ${cen.nome}. Sem vantagens — na raça.`,"");
  salvar(); renderTudo();
}

/* ---------- helpers ---------- */
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
function realidade(st){ // índice de prosperidade real (o que a cidade vive)
  return clamp(Math.round(st.abastecimento*0.35 + st.moradia*0.3 + st.produtividade*0.35 - st.corrupcao*0.5), 0, 100);
}
function multIgnorancia(st){ // demagogia rende menos numa cidade educada
  const base = clamp(1 - st.escolaridade/150, 0.3, 1);
  // Lógica na grade da escola: a cidade aprende a farejar falácia — a armadilha do próprio jogo desarma
  return discAtiva("logica") ? Math.max(0.2, base - 0.25) : base;
}
function salvar(){ localStorage.setItem(SAVE_KEY, JSON.stringify(S)); }
function carregar(){
  try{ const d = JSON.parse(localStorage.getItem(SAVE_KEY)); return d && Array.isArray(d.jogadas) ? d : null; }
  catch(e){ return null; }
}

/* ---------- efeitos ---------- */
function aplicar(ef, origem){
  const antes = {aprovacao:S.aprovacao, caixa:S.caixa};
  for(const k in ef){
    if(k === "aprovBase"){ S.aprovacao = clamp(S.aprovacao + Math.round(ef[k]*multIgnorancia(S)), 0, 100); }
    else if(k === "flags"){ Object.assign(S.flags, ef[k]); }
    else if(k === "imprensaLivre"){ S.imprensaLivre = ef[k]; }
    else if(typeof S[k] === "number"){ S[k] = k==="caixa" || k==="lucidez" ? S[k]+ef[k] : clamp(S[k]+ef[k],0,100); }
  }
  S.ultimoDelta = {aprovacao:S.aprovacao-antes.aprovacao, caixa:S.caixa-antes.caixa};
}
function agendar(lista){ for(const a of (lista||[])) S.agendados.push({...a}); }
function xpApp(n, chave){ // deposita XP pro perfil do app (creditado pela via oficial no proximo boot)
  if(S.flags[chave]) return; S.flags[chave]=true;
  try{ const p=parseInt(localStorage.getItem('escola_jogo_xp_pendente')||'0',10)||0;
       localStorage.setItem('escola_jogo_xp_pendente', String(p+n)); }catch(e){}
}
function noticia(txt, tom){ S.noticias.unshift({txt, tom:tom||""}); S.noticias = S.noticias.slice(0,2); }

function passarSemana(){
  S.semana++;
  // efeitos agendados vencem
  const vencidos = [];
  S.agendados = S.agendados.filter(a=>{ a.em--; if(a.em<=0){vencidos.push(a); return false} return true; });
  for(const a of vencidos){ aplicar(a.ef, "agendado"); if(a.msg) noticia(a.msg, a.tom||"ruim"); }
  // administração manual: obras andam, contribuições chegam, cidade degrada
  tickLotes();
  // corrupção silenciosa sem imprensa livre
  if(!S.imprensaLivre){ S.corrupcao = clamp(S.corrupcao+2,0,100); S.caixa -= 4; }
  // aprovação persegue a realidade só se a imprensa mede a realidade
  if(S.imprensaLivre){ S.aprovacao = clamp(Math.round(S.aprovacao + (realidade(S)-S.aprovacao)*0.12), 0, 100); }
  else { S.aprovacao = clamp(S.aprovacao+1, 0, 100); }
  // gatilho de crise
  if(!S.criseDisparada && (S.abastecimento<55 || S.moradia<55)){
    S.criseDisparada = true;
    doShake(); sfx("crise");
    if(!S.imprensaLivre){ S.aprovacao = clamp(S.aprovacao-18,0,100); noticia("A verdade vazou: ninguém mais acredita no Diário Oficial. Confiança desabou.","ruim"); }
  }
  // gatilho da crise fiscal do 2º mandato
  if(S.modo==="campanha" && S.mandato>=2 && !S.flags.crise2Disparada && (S.caixa<0 || S.produtividade<48)){
    S.flags.crise2Disparada = true;
  }
  // crise de confiança (Ato 2, disparada por efeito agendado do calote): chega com o mesmo peso das outras
  if(S.flags.crise3Disparada && !S.flags.crise3Sentida){ S.flags.crise3Sentida = true; doShake(); sfx("crise"); }
  // streak de prosperidade (suco: 🔥 semanas seguidas de cidade saudável)
  S.streak = realidade(S)>=60 ? (S.streak||0)+1 : 0;
  // regra viva do cenário (litorânea/mineradora/capital)
  if(S.modo==="vitalicio" && S.cenarioTick && S.semana>1 && S.semana % S.cenarioTick.cada === 0){
    aplicar(S.cenarioTick.ef);
    noticia(S.cenarioTick.msg, S.cenarioTick.ef.caixa>0 ? "boa" : "ruim");
  }
  // VITALÍCIO: condições de queda
  if(S.modo==="vitalicio" && !S.fim){
    S.semanasAprovBaixa = S.aprovacao<15 ? (S.semanasAprovBaixa||0)+1 : 0;
    if(S.semanasAprovBaixa>=2){ doShake(); sfx("gameover"); gameOverVitalicio("impeachment"); return; }
    if(S.caixa<-80){ doShake(); sfx("gameover"); gameOverVitalicio("falencia"); return; }
  }
}

/* materializa uma carta: escala magnitudes pela dificuldade e variância da seed */
const CHAVES_ESCALA = ["aprovBase","aprovacao","caixa","abastecimento","moradia","produtividade","corrupcao","escolaridade"];
function matEf(ef, fator){
  if(!ef) return ef;
  const o = {};
  for(const k in ef) o[k] = (typeof ef[k]==="number" && CHAVES_ESCALA.includes(k)) ? Math.round(ef[k]*fator) || (ef[k]>0?1:-1) : ef[k];
  return o;
}
function sortearCartaV(){
  const rnd = rngRun();
  const esc = 1 + Math.min(S.semana*0.012, 0.6);           // dificuldade sobe com o tempo
  // evento externo ~22% das semanas (a partir da semana 4)
  if(S.semana>3 && rnd()<0.22){
    const aptos = EVENTOSV.filter(e=>e.teste(S) && !S.vistas.slice(-6).includes(e.id));
    if(aptos.length){
      const e = aptos[Math.floor(rnd()*aptos.length)];
      S.vistas.push(e.id);
      return { id:e.id, tipo: e.tom==="ruim"?"crise":"filler", quem:"A cidade", titulo:e.titulo, texto:e.texto,
        opcoes:[{rotulo:"Atravessar a semana", custo:"", ef:matEf(e.ef, esc), news:[e.texto, e.tom]}] };
    }
  }
  const aptas = DECKV.filter(c=>!S.vistas.slice(-10).includes(c.id));
  const t = aptas.length? aptas[Math.floor(rnd()*aptas.length)] : DECKV[Math.floor(rnd()*DECKV.length)];
  S.vistas.push(t.id);
  const fator = esc * (0.8 + rnd()*0.4);
  return {
    id:t.id, tipo:t.tipo, quem:t.quem, titulo:t.titulo, texto:t.texto, momento:t.momento,
    opcoes: t.op.map(o=>({ rotulo:o.r, custo:o.c||"", ef:matEf(o.ef, fator), lucidez:o.lucidez,
      ag:(o.ag||[]).map(a=>({em:a.em, ef:matEf(a.ef, fator), msg:a.msg, tom:a.tom})) }))
  };
}

/* ---------- currículo da cidade (GDD 6.1): educação como vacina ----------
   O jogador monta a grade da escola com disciplinas REAIS da Escola Liberal.
   Cada uma tem efeito sistêmico próprio, retorno LENTO (primeira turma leva
   semanas) e linka pro módulo real do app — o jogo é o mapa do currículo. */
const FORMATURA = 10; // semanas até a primeira turma se formar
const GRADE = [
  {id:"financeira",  emoji:"💰", nome:"Educação Financeira", custo:30, mod:27,
   efeito:"cidadãos poupam e investem — +1 no caixa toda semana"},
  {id:"logica",      emoji:"🧠", nome:"Lógica",              custo:30, mod:36,
   efeito:"vacina contra falácias — promessas fáceis rendem bem menos aprovação"},
  {id:"empreendedor",emoji:"🚀", nome:"Empreendedorismo",    custo:35, mod:66,
   efeito:"a cada 6 semanas um ex-aluno abre negócio — arrecadação sem subir imposto"},
  {id:"voto",        emoji:"🗳️", nome:"Voto Consciente",     custo:25, mod:174,
   efeito:"as urnas passam a enxergar a gestão real, não só o marketing"}
];
function discAtiva(id){ // efeito só depois da primeira turma formada
  const d = (S.curriculo||[]).find(x=>x.id===id);
  return !!d && (S.semana - d.desde) >= FORMATURA;
}
function adicionarDisciplina(g){
  if(S.caixa < g.custo || (S.curriculo||[]).find(x=>x.id===g.id)) return;
  S.caixa -= g.custo;
  S.curriculo.push({id:g.id, desde:S.semana});
  sfx("ding"); fecharLote(); salvar(); renderTudo();
  noticia(`📚 ${g.nome} entrou na grade da escola. A primeira turma se forma em ${FORMATURA} semanas — educação é o investimento mais lento (e mais teimoso) da cidade.`,"boa");
}

function acoesDoLote(l){
  const acs = [];
  const eq = equipeLivre();
  const semEq = eq? "" : ` · equipe ocupada (${Math.max(...S.equipes.map(e=>e.ocupada))} sem)`;
  if(l.estado==="obra"){ acs.push({rot:"🔨 Obra em andamento", custo:`faltam ${l.obraSemanas} semana(s)`, off:true}); return acs; }
  if(l.tipo==="pref"){
    const livres = S.equipes.filter(e=>e.ocupada<=0).length;
    acs.push({rot:`👷 Equipes de obras: ${S.equipes.length} (${livres} livre${livres!==1?"s":""})`, custo:"o recurso mais disputado da cidade", off:true});
    if(S.equipes.length<2){
      acs.push({rot:"➕ Contratar 2ª equipe de obras", custo:"−60 do caixa · duas obras ao mesmo tempo", off:S.caixa<60,
        run:()=>{ S.caixa-=60; S.equipes.push({ocupada:0, loteId:null}); sfx("ding"); fecharLote(); salvar(); renderTudo();
                  noticia("2ª equipe de obras contratada: a cidade agora anda em duas frentes.","boa"); }});
    }
    return acs;
  }
  if(l.estado==="ruim"){
    acs.push({rot:"🔧 Enviar equipe de obras", custo:`−8 do caixa · 2 semanas${semEq}`, off:!eq||S.caixa<8,
      run:()=>iniciarObra(l, 2, 8, {produtividade:2}, `${l.nome} recuperada: a cidade sente na hora.`)});
  }
  if(l.tipo==="escola" && l.nivel<3 && l.estado==="bom"){
    const custo = l.nivel===1? 25 : 40;
    acs.push({rot:`📚 Ampliar a escola (nível ${l.nivel+1})`, custo:`−${custo} do caixa · 3 semanas${semEq} · +escolaridade e +vagas na grade`, off:!eq||S.caixa<custo,
      run:()=>iniciarObra(l, 3, custo, {escolaridade:4}, "Escola ampliada: mais turmas, mais futuro conferindo as contas.", {nivelUp:true})});
  }
  if(l.tipo==="escola" && l.estado!=="obra"){
    // grade curricular: nível da escola = vagas (1 → 1 disciplina, 2 → 2, 3 → todas)
    const vagas = l.nivel>=3? GRADE.length : l.nivel;
    const naGrade = S.curriculo||[];
    for(const g of GRADE){
      const tem = naGrade.find(x=>x.id===g.id);
      if(tem){
        const falta = FORMATURA - (S.semana - tem.desde);
        acs.push({rot:`${g.emoji} ${g.nome} ✓`,
          custo:(falta>0? `primeira turma em ${falta} semana${falta===1?"":"s"}` : "turma formada — efeito ativo")+" · toque para estudar a disciplina real",
          run:()=>{ window.open("https://escolaliberal.com.br/app.html#module-"+g.mod, "_blank", "noopener"); }});
      } else if(naGrade.length < vagas){
        acs.push({rot:`${g.emoji} Adicionar ${g.nome} à grade`,
          custo:`−${g.custo} do caixa · ${g.efeito} · primeira turma em ${FORMATURA} semanas`,
          off:S.caixa<g.custo, run:()=>adicionarDisciplina(g)});
      }
    }
    if(naGrade.length>=vagas && naGrade.length<GRADE.length)
      acs.push({rot:"🏫 Grade cheia para o tamanho da escola", custo:"amplie a escola para abrir mais vagas", off:true});
  }
  if(l.tipo==="praca" && !l.construcao && l.estado==="bom"){
    for(const c of CONSTRUCOES.praca)
      acs.push({rot:c.nome, custo:`${c.custo? "−"+c.custo+" do caixa · ":""}concessão privada · ${c.desc}`, off:S.caixa<c.custo,
        run:()=>construir(l, c)});
  }
  if(l.tipo==="vazio" && !l.construcao){
    for(const c of CONSTRUCOES.vazio)
      acs.push({rot:c.nome, custo:`−${c.custo} do caixa · leilão · 3 semanas de obra · ${c.desc}`, off:!eq||S.caixa<c.custo,
        run:()=>{ iniciarObra(l, 3, c.custo, c.umaVez||{}, `${c.nome} inaugurado no antigo terreno vazio.`, {constr:c}); }});
  }
  if(!acs.length) acs.push({rot:"✅ Funcionando bem", custo:"nada a fazer aqui por enquanto", off:true});
  return acs;
}
function iniciarObra(l, semanas, custo, efeitoFim, msgFim, extra){
  const eq = equipeLivre(); if(!eq || S.caixa<custo) return;
  if(S.flags.perkMestre) semanas = Math.max(1, semanas-1);
  S.caixa -= custo;
  l.estado = "obra"; l.obraSemanas = semanas; l.obraTotal = semanas;
  l._fim = {efeitoFim, msgFim, ...(extra||{})}; // serializável: sobrevive ao save
  eq.ocupada = semanas; eq.loteId = l.id;
  sfx("click"); fecharLote(); salvar(); renderTudo();
  noticia(`Equipe de obras alocada: ${l.nome} (${semanas} semanas).`,"");
}
function construir(l, c){
  if(S.caixa < c.custo) return;
  S.caixa -= c.custo;
  aplicarConstrucao(l, c);
  if(c.umaVez) aplicar(c.umaVez);
  sfx("ding"); fecharLote(); salvar(); renderTudo();
  noticia(`${c.nome} — contrato assinado. A cidade decide com os pés se você acertou.`,"boa");
}
function aplicarConstrucao(l, c){
  l.construcao = c.id; l.semanal = c.semanal || null;
  l.emoji = c.nome.split(" ")[0]; l.nome = c.nome.replace(/^\S+\s/,"");
  l.tipo = l.tipo==="praca" ? "praca" : "constr";
}
const ICONE_VAR = {caixa:"💰", produtividade:"⚙️", abastecimento:"🛒", moradia:"🏠", escolaridade:"📚", aprovacao:"👍"};
let _flutuas = []; // transiente (não vai pro save): animações pendentes por lote
function tickLotes(){
  // obras andam; equipe libera; contribuições semanais chegam; rua ruim cobra
  for(const eq of S.equipes) if(eq.ocupada>0) eq.ocupada--;
  for(const l of S.lotes){
    if(l.estado==="obra"){
      l.obraSemanas--;
      if(l.obraSemanas<=0){
        l.estado="bom";
        l._inaugura = true;
        if(l._fim){
          if(l._fim.nivelUp) l.nivel++;
          if(l._fim.constr) aplicarConstrucao(l, l._fim.constr);
          aplicar(l._fim.efeitoFim||{});
          noticia("🔨 "+(l._fim.msgFim||"Obra concluída."),"boa"); sfx("ding");
          l._fim=null;
        }
      }
    }
    if(l.semanal && l.estado==="bom"){
      aplicar(l.semanal);
      for(const k in l.semanal) if(l.semanal[k]>0) _flutuas.push({id:l.id, txt:`+${l.semanal[k]}${ICONE_VAR[k]||""}`, tipo:"pos"});
    }
    if(l.tipo==="rua" && l.estado==="ruim"){
      S.aprovacao = clamp(S.aprovacao-1,0,100);
      _flutuas.push({id:l.id, txt:"−1👍", tipo:"neg"});
    }
  }
  // currículo da cidade: cada disciplina formada trabalha sozinha, e os efeitos COMPÕEM (GDD 6.1)
  for(const c of (S.curriculo||[])){
    const idade = S.semana - c.desde;
    const g = GRADE.find(x=>x.id===c.id); if(!g) continue;
    if(idade === FORMATURA){
      aplicar({escolaridade:4});
      _flutuas.push({id:"escola", txt:"+4📚", tipo:"pos"});
      noticia(`🎓 Primeira turma de ${g.nome} formada. A partir de agora: ${g.efeito}.`,"boa"); sfx("ding");
    }
    if(idade >= FORMATURA){
      if(c.id==="financeira"){ aplicar({caixa:1}); _flutuas.push({id:"escola", txt:"+1💰", tipo:"pos"}); }
      if(c.id==="empreendedor" && idade % 6 === 0){
        aplicar({caixa:6, produtividade:1});
        _flutuas.push({id:"escola", txt:"+6💰", tipo:"pos"});
        noticia("🚀 Um ex-aluno da escola abriu negócio próprio: arrecadação nova sem subir um centavo de imposto.","boa");
      }
      // logica age em multIgnorancia (demagogia rende menos); voto age na apuração das urnas
    }
  }
  // degradação: a cidade nunca fica pronta (mais agressiva no vitalício)
  const rnd = rngRun();
  const chance = S.modo==="vitalicio" ? 0.12 : 0.06;
  if(rnd() < chance){
    const alvos = S.lotes.filter(l=>l.estado==="bom" && ["rua","moradia","padaria","mercado"].includes(l.tipo));
    if(alvos.length){
      const l = alvos[Math.floor(rnd()*alvos.length)];
      l.estado = "ruim";
      noticia(`⚠️ ${l.nome} precisa de manutenção — a cidade não espera.`,"ruim");
    }
  }
  // A CIDADE CRESCE: prosperidade sustentada abre bairros novos
  const EXPANSOES = [
    {flag:"exp1", streak:4,  nome:"Bairro Norte",     lotes:[{id:"norte1", nome:"terreno · Norte", emoji:"🌱", tipo:"vazio", nivel:0, estado:"bom"},{id:"norte2", nome:"terreno · Norte", emoji:"🌱", tipo:"vazio", nivel:0, estado:"bom"}]},
    {flag:"exp2", streak:8,  nome:"Bairro do Lago",   lotes:[{id:"lago1", nome:"terreno · Lago", emoji:"🌱", tipo:"vazio", nivel:0, estado:"bom"},{id:"lago2", nome:"terreno · Lago", emoji:"🌱", tipo:"vazio", nivel:0, estado:"bom"}]},
    {flag:"exp3", streak:12, nome:"Alto da Colina",   lotes:[{id:"alto1", nome:"terreno · Colina", emoji:"🌱", tipo:"vazio", nivel:0, estado:"bom"},{id:"alto2", nome:"terreno · Colina", emoji:"🌱", tipo:"vazio", nivel:0, estado:"bom"}]}
  ];
  for(const ex of EXPANSOES){
    if(!S.flags[ex.flag] && (S.streak||0) >= ex.streak){
      S.flags[ex.flag] = true;
      for(const nl of ex.lotes){ nl._revela = true; S.lotes.push(nl); }
      noticia(`🏙️ A cidade cresceu: ${ex.nome} aberto para construção! Prosperidade atrai gente — e gente precisa de espaço.`,"boa");
      sfx("recorde");
      break;
    }
  }
}

/* ---------- cidade-fantasma no horizonte: a cidade do vizinho em 3D ----------
   Snapshot chega P2P pelo link de duelo (r=prosperidade, b=construções).
   Skyline determinística por vizinho (mulberry32 do nick) — mesma cidade, sempre. */
function lerVizinho(){
  try{
    const v = JSON.parse(localStorage.getItem("jogo_vizinho")||"null");
    return (v && v.n)? v : null;
  }catch(e){ return null; }
}
let _vizinhoKey = null; // rebuild só quando o vizinho muda (a cena 3D anima sozinha)
function renderVizinho(){
  const el = $("horizonte"); if(!el) return;
  const v = lerVizinho();
  if(!v){ el.hidden = true; el.innerHTML = ""; _vizinhoKey = null; return; }
  const chave = v.n + "|" + v.p + "|" + v.r + "|" + v.b;
  if(chave === _vizinhoKey && !el.hidden) return;
  _vizinhoKey = chave;
  el.hidden = false;
  const rng = mulberry32([...String(v.n)].reduce((a,c)=>a+c.charCodeAt(0),0)*131 + (v.p||0)*7 + (v.b||0)+1);
  const nTorres = clamp(4 + Math.round((v.b==null? 6 : v.b)*0.7), 4, 13);
  const escala = 0.38 + (clamp(v.r==null? 50 : v.r, 0, 100)/100)*0.62; // prosperidade = altura da skyline
  let torres = "";
  for(let i=0;i<nTorres;i++){
    const w = 15 + Math.round(rng()*18);
    const h = Math.round((16 + rng()*48) * escala);
    const d = 10 + Math.round(rng()*9);
    const x = 3 + (i/nTorres)*86 + rng()*4;
    const z = Math.round(rng()*46);
    const jan = rng() > 0.4;
    torres += `<div class="fpredio" style="left:${x.toFixed(1)}%; width:${w}px; height:${h}px; transform:translateZ(-${z}px)">
      <span class="face frente${jan?" janelas":""}" style="transform:translateZ(${d}px)"></span>
      <span class="face lado" style="width:${d}px; transform:rotateY(-90deg)"></span>
      <span class="face lado" style="width:${d}px; left:100%; transform:rotateY(-90deg)"></span>
      <span class="face topo" style="height:${d}px; transform:rotateX(90deg)"></span>
    </div>`;
  }
  el.innerHTML = `<div class="cena">${torres}</div><div class="neblina"></div>
    <button type="button" class="fantasma-tag" id="vizinhoTag" aria-label="Ver cidade vizinha">🏙️ Cidade de ${nickLimpo(v.n)} · ${v.p} sem</button>`;
  document.getElementById("vizinhoTag")?.addEventListener("click", abrirVizinho);
}
function abrirVizinho(){
  const v = lerVizinho(); if(!v) return;
  fecharLote();
  const ov = document.createElement("div");
  ov.id = "loteSheet";
  ov.innerHTML = `<div class="ls-pano"></div>
    <div class="ls-caixa">
      <div class="ls-tit">🏙️ Cidade de ${nickLimpo(v.n)}</div>
      <p style="margin:2px 0 10px; font-size:12.5px; line-height:1.55; color:var(--tinta-3)">
        Vizinha no horizonte · sobreviveu <b>${v.p} semana${v.p===1?"":"s"}</b>${v.r!=null?` · prosperidade <b>${v.r}%</b>`:""}${v.b!=null?` · <b>${v.b}</b> construções`:""}.<br>
        O retrato chega pelo link de duelo — termine uma run e desafie de volta para aparecer no horizonte de lá.</p>
      <div class="opcoes">
        ${DUELO_PENDENTE? `<button class="opcao destaque" data-a="aceitar" type="button">⚔️ Aceitar o duelo pendente<span class="custo">a mesma cidade, sem vantagens</span></button>`:""}
        <button class="opcao" data-a="remover" type="button">🌫️ Remover do horizonte<span class="custo">a cidade-fantasma some do seu mapa</span></button>
      </div>
    </div>`;
  document.body.appendChild(ov);
  ov.querySelector(".ls-pano").addEventListener("click", fecharLote);
  ov.querySelector('[data-a="aceitar"]')?.addEventListener("click", ()=>{ fecharLote(); if(DUELO_PENDENTE) iniciarDuelo(DUELO_PENDENTE); });
  ov.querySelector('[data-a="remover"]').addEventListener("click", ()=>{
    try{ localStorage.removeItem("jogo_vizinho"); }catch(e){}
    fecharLote(); renderVizinho();
  });
}

function gameOverVitalicio(causa){
  const score = S.semana - 1;
  const novoRecorde = score > (META.melhorScore||0);
  if(novoRecorde) META.melhorScore = score;
  const destravou = [];
  if(score>=20 && !META.sobreviveu20){ META.sobreviveu20=true; destravou.push("💰 Caixa Reserva e 🌊 Cidade Litorânea"); }
  if(score>=30 && !META.sobreviveu30){ META.sobreviveu30=true; destravou.push("⛏️ Cidade Mineradora"); }
  if(score>=40 && !META.sobreviveu40){ META.sobreviveu40=true; destravou.push("👷 Mestre de Obras"); }
  if(score>=50 && !META.sobreviveu50){ META.sobreviveu50=true; destravou.push("🏙️ A Capital"); }
  salvarMeta();
  if(destravou.length) noticia(`🎖️ Conquista destravada: ${destravou.join(" e ")} — disponível como vantagem nas próximas runs.`,"boa");
  const causas = {
    impeachment: "A Câmara abriu o processo com a praça cheia. Aprovação no chão não paga a conta de ninguém — nem a sua.",
    falencia: "A cidade quebrou. Fornecedor não entrega, servidor não recebe, e a caneta que assinava mágica ficou sem tinta.",
    urnas: "As urnas falaram. O Prometedor assume na segunda-feira — e a cidade que você segurou por " + score + " semanas agora é o laboratório dele."
  };
  S.fim = { modo:"vitalicio", causa, score, novoRecorde, recorde: META.melhorScore,
            desc: causas[causa]||"", r: realidade(S) };
  if(S.duelo){ // duelo resolvido: placar lado a lado no fim
    S.fim.duelo = { nick:S.duelo.nick, deles:S.duelo.score, venceu: score > S.duelo.score, empate: score === S.duelo.score };
    if(S.fim.duelo.venceu){ META.duelosVencidos = (META.duelosVencidos||0)+1; salvarMeta(); }
  }
  salvar(); renderTudo();
}

function renderMedidores(){
  const r = realidade(S);
  const d = S.ultimoDelta || {};
  const itens = [
    {rot:"Aprovação", val:S.aprovacao+"%", pct:S.aprovacao, cor:"var(--ouro)", delta:d.aprovacao},
    {rot:"Caixa", val:S.caixa, pct:clamp(S.caixa,0,150)/1.5, cor:S.caixa<0?"var(--vermelho)":"var(--verde)", delta:d.caixa},
    {rot:"Lucidez", val:"💡 "+S.lucidez, pct:clamp(S.lucidez*20,0,100), cor:"var(--lucidez)", oculto:S.lucidez===0 && !S.painelEconomico},
    {rot:"Abastecimento", val:S.abastecimento+"%", pct:S.abastecimento, cor:S.abastecimento<45?"var(--vermelho)":"var(--azul)", oculto:!S.painelEconomico},
    {rot:"Moradia", val:S.moradia+"%", pct:S.moradia, cor:S.moradia<45?"var(--vermelho)":"var(--azul)", oculto:!S.painelEconomico}
  ];
  $("medidores").innerHTML = itens.map(m=>
    `<div class="medidor${m.oculto?" oculto":""}" data-med="${m.rot}">
       <div class="rotulo"><span>${m.rot}</span>${m.delta? `<span class="delta ${m.delta>0?"pos":"neg"}">${m.delta>0?"+":""}${m.delta}</span>`:""}</div>
       <div class="valor">${m.val}</div>
       <div class="barra"><i style="width:${m.pct}%;background:${m.cor}"></i></div>
     </div>`).join("");
  // números rolando (count-up) — o valor viaja do anterior ao novo
  window._med = window._med || {};
  for(const m of itens){
    const alvo = parseInt(String(m.val).replace(/[^\d-]/g,""),10);
    const de = window._med[m.rot];
    window._med[m.rot] = alvo;
    if(de===undefined || de===alvo || isNaN(alvo)) continue;
    const el = document.querySelector(`[data-med="${m.rot}"] .valor`);
    if(!el) continue;
    const t0 = performance.now(), dur = 550, sufixo = String(m.val).replace(/^[💡\s]*-?\d+/,"");
    const prefixo = String(m.val).match(/^💡\s*/)? "💡 " : "";
    (function anima(t){
      const p = Math.min((t-t0)/dur, 1), e = 1-Math.pow(1-p,3);
      el.textContent = prefixo + Math.round(de + (alvo-de)*e) + sufixo;
      if(p<1) requestAnimationFrame(anima);
    })(t0);
  }
}

  const r = realidade(S);
  const el = $("cidade");
  el.className = "cidade " + (r>=60?"estado-prospero": r>=40?"estado-alerta":"estado-crise");
  $("skyline").innerHTML = S.lotes.map((l,i)=>{
    const fechado = (l.tipo==="padaria" && S.flags.padariaFechou && !S.criseResolvida);
    const fila = (l.tipo==="padaria"||l.tipo==="mercado") && S.abastecimento<50 && !fechado;
    const badge = l.estado==="obra" ? `🔨${l.obraSemanas}`
                : l.estado==="ruim" ? "⚠️"
                : (l.tipo==="escola" && (S.curriculo||[]).length) ? (l.nivel>1?"✦".repeat(l.nivel-1):"")+`🎓${S.curriculo.length}`
                : l.nivel>1 ? "✦".repeat(l.nivel-1)
                : l.tipo==="vazio" ? "＋" : "";
    const acionavel = !fechado;
    const pct = l.estado==="obra" && l.obraTotal ? Math.round((1 - l.obraSemanas/l.obraTotal)*100) : 0;
    const extras = (l._revela? " revela":"") + (l._inaugura? " inaugura":"");
    return `<button type="button" class="predio lote ${l.estado}${fechado?" fechado":""}${extras}" data-lote="${i}" ${acionavel?"":"disabled"}
      aria-label="Administrar ${l.nome}">
      <span class="tag">FECHADO</span>
      ${l.estado==="obra"?`<span class="operario">👷</span><span class="obra-barra" style="width:${pct}%"></span>`:""}
      ${badge?`<span class="lote-badge${l.estado==="ruim"?" ruim":""}">${badge}</span>`:""}
      <div class="fila" style="opacity:${fila?1:0}">🧍🧍🧍🧍</div>
      ${l.emoji}<small>${l.nome}</small></button>`;
  }).join("");
  $("skyline").querySelectorAll("[data-lote]").forEach(b=>b.addEventListener("click",()=>abrirLote(+b.dataset.lote)));
  // festa de inauguração + reveal de bairro novo (uma vez cada)
  S.lotes.forEach((l,i)=>{
    if(l._inaugura){ confetarEm(document.querySelector(`[data-lote="${i}"]`)); sfx("ding"); l._inaugura=false; }
    if(l._revela){ setTimeout(()=>{ confetarEm(document.querySelector(`[data-lote="${i}"]`)); }, 400); l._revela=false; }
  });
  renderVizinho(); // cidade-fantasma do vizinho no horizonte (se houver)
  const pop = 12400 + Math.round((r-50)*40);
  const fogo = (S.streak||0)>=3 ? ` · 🔥×${S.streak}` : "";
  $("populacao").textContent = `👥 ${pop.toLocaleString("pt-BR")} habitantes · prosperidade real ${r}%${fogo}`;
  $("semana").textContent = S.modo==="vitalicio" ? `Semana ${S.semana} · Cidade #${S.seed}` : `Semana ${S.semana} do mandato`;
}

function renderNoticias(){
  $("noticias").innerHTML = S.noticias.map(n=>`<div class="noticia ${n.tom}">${n.txt}</div>`).join("");
}

const FILLER_TEXTOS = [
  "Reuniões, despachos, uma fita inaugurada. Nada urgente — mas as decisões passadas seguem trabalhando, a favor ou contra você.",
  "Semana de rotina na prefeitura. A cidade segue seu curso; as consequências, também.",
  "Sem manchetes esta semana. O que você plantou continua crescendo em silêncio."
];
function cartaAtual(){
  // duelo recebido por link: o convite fura a fila — inclusive sobre tela de fim
  if(DUELO_PENDENTE){
    const d = DUELO_PENDENTE, cen = CENARIOS.find(c=>c.id===d.c) || CENARIOS[0];
    return { id:"duelo-convite", tipo:"filler", quem:"⚔️ Desafio recebido", titulo:`${d.n} te desafiou`,
      momento:{img:"vitoria.jpg", emoji:"⚔️", legenda:`${cen.emoji} ${cen.nome} — cidade #${d.s}, a mesma para os dois.`},
      texto:`<b>${d.n}</b> sobreviveu <b>${d.p} semana${d.p===1?"":"s"}</b> como prefeito da ${cen.emoji} <b>${cen.nome}</b> e duvida que você aguente mais. Mesma cidade, mesmas cartas, sem vantagens: só a sua gestão contra o placar.`,
      opcoes:[
        {rotulo:"⚔️ Aceitar o duelo", custo:`sobreviva mais de ${d.p} semana${d.p===1?"":"s"}`, ef:{}, duelo:true, destaque:true},
        {rotulo:"Agora não", custo:"o convite será descartado", ef:{}, semSemana:true, aoEscolher:()=>descartarDuelo()}
      ]};
  }
  // capa: a primeira coisa que o jogador vê é a cidade — em foto
  if(!S.flags.viuCapa) return {
    id:"capa", tipo:"filler", quem:"Cidade Livre", titulo:"A cidade é sua",
    momento:{img:"vitoria.jpg", emoji:"🏛️", legenda:"Rua Principal, 6h50 da manhã do seu primeiro dia de mandato."},
    texto: META.campanhaVencida
      ? "Você já provou que sabe governar. A campanha te ensinou as engrenagens — o Vitalício testa até quando você aguenta: cartas sorteadas, dificuldade crescente, e três jeitos de cair. A Cidade da Semana é a mesma para todos os prefeitos do Brasil."
      : "Você acaba de assumir a prefeitura. A cidade funciona, o comércio abre cedo, a obra avança. Cada decisão sua vai deixar isso melhor — ou pior. E ninguém vai te contar qual foi o momento exato em que tudo mudou.",
    opcoes: META.campanhaVencida ? [
      {rotulo:"🏛️ Prefeito Vitalício — a Cidade da Semana", custo:`Sobreviva o máximo · recorde: ${META.melhorScore||0} semanas`, ef:{}, aoEscolher:()=>{}, vitalicio:true, destaque:true},
      {rotulo:"Rejogar a campanha", custo:"A história completa, do primeiro dia ao legado", ef:{}, aoEscolher:s=>{s.flags.viuCapa=true}}
    ] : [
      {rotulo:"Assumir o mandato", custo:"", ef:{}, aoEscolher:s=>{s.flags.viuCapa=true}, destaque:true},
      {rotulo:"🔒 Prefeito Vitalício", custo:"Vença a campanha para destravar o modo infinito", ef:{}, bloqueada:true}
    ]
  };
  // VITALÍCIO: eleição a cada 14 semanas; senão, carta sorteada do deck procedural
  if(S.modo==="vitalicio"){
    if(!S.cenario){
      return { id:"cenarios", tipo:"filler", quem:"Prefeito Vitalício", titulo:"Escolha sua cidade",
        texto:"Cada cidade tem uma economia — e um defeito de nascença. Sobreviver aqui te destrava as próximas.",
        opcoes: CENARIOS.map(c=>({
          rotulo:`${c.emoji} ${c.nome}`, custo: c.unlock()? c.desc : "🔒 "+c.req,
          ef:{}, bloqueada:!c.unlock(), semSemana:true,
          aoEscolher:s=>{
            s.cenario = c.id;
            s.seed = seedDaSemana()*10 + c.idx; // Cidade da Semana própria por cenário
            if(c.tick) s.cenarioTick = c.tick;
            aplicar(c.mods||{});
            noticia(`${c.emoji} ${c.nome} — Cidade da Semana #${s.seed}. Boa sorte, prefeito.`,"");
          }
        }))
      };
    }
    if(S.flags.escolherPerk){
      const PERKS = [
        {id:"termometro", cond:META.campanhaVencida,      rot:"🌡️ Termômetro de Hazlitt", desc:"Começa enxergando: painel econômico instalado desde a semana 1", aplica:s=>{s.painelEconomico=true}},
        {id:"reserva",    cond:META.sobreviveu20,          rot:"💰 Caixa Reserva",          desc:"Governo herdado com gordura: +30 no caixa inicial", aplica:s=>{s.caixa+=30}},
        {id:"mestre",     cond:META.sobreviveu40,          rot:"👷 Mestre de Obras",        desc:"Toda obra leva 1 semana a menos", aplica:s=>{s.flags.perkMestre=true}}
      ];
      const opcoes = PERKS.map(p=>({
        rotulo:p.rot, custo: p.cond? p.desc : "🔒 "+({termometro:"vença a campanha",reserva:"sobreviva 20 semanas",mestre:"sobreviva 40 semanas"})[p.id],
        ef:{}, bloqueada:!p.cond, semSemana:true,
        aoEscolher:s=>{ s.flags.escolherPerk=false; p.aplica(s); }
      }));
      opcoes.push({rotulo:"Sem vantagem — na raça", custo:"o jeito clássico", ef:{}, semSemana:true, aoEscolher:s=>{s.flags.escolherPerk=false}});
      return { id:"perks", tipo:"filler", quem:"Prefeito Vitalício", titulo:"Escolha sua vantagem",
        texto:"Cada queda ensina. As conquistas das suas runs anteriores viram vantagens permanentes — leve UMA para esta cidade.",
        opcoes };
    }
    if(S.criseDisparada && !S.flags.criseVista) return DECK.find(c=>c.id==="a1-11");
    if(S.semana>1 && S.semana%14===0 && !S.flags["elei_"+S.semana]) return {
      id:"elei-v"+S.semana, tipo:"eleicao", quem:"A cidade", titulo:"Eleição — mandato "+(Math.floor(S.semana/14)+1),
      texto:"As urnas de novo. A cada mandato o palanque do Prometedor cresce — e a memória da cidade encurta.",
      opcoes:[{rotulo:"Aguardar a apuração", custo:"", ef:{}, eleicao:true, destaque:true}]
    };
    return sortearCartaV();
  }
  // cartas de crise são dinâmicas: entram na frente do deck assim que o gatilho dispara
  if(S.criseDisparada && !S.flags.criseVista) return DECK.find(c=>c.id==="a1-11");
  if(S.flags.crise2Disparada && !S.flags.crise2Vista) return DECK.find(c=>c.id==="m2-crise");
  if(S.flags.crise3Disparada && !S.flags.crise3Vista) return DECK.find(c=>c.id==="a2-crise");
  // momento da recuperação: a cidade respira depois da reforma surtir efeito
  if(S.flags.reformou && (S.flags.recuperou || S.abastecimento>=60) && !S.flags.vistaSolucao) return {
    id:"m-solucao", tipo:"filler", quem:"A cidade", titulo:"As prateleiras voltaram",
    momento:{img:"solucao.jpg", emoji:"🥖 🌅", legenda:"A mesma padaria, semanas depois: prateleira cheia, porta aberta, fila nenhuma."},
    texto:"Sem cerimônia, sem manchete: o pão voltou à prateleira e a fila sumiu. A cidade nem percebeu o dia exato em que a normalidade voltou — ela simplesmente voltou.",
    opcoes:[{rotulo:"Seguir governando", custo:"", ef:{}, aoEscolher:s=>{s.flags.vistaSolucao=true}, destaque:true}]
  };
  // deck por elegibilidade (não por ponteiro): carta pulada por condição volta quando a condição vira verdade
  const eleg = DECK.filter(c => c.tipo!=="crise" && c.tipo!=="eleicao" && !S.jogadas.includes(c.id) && (!c.cond || c.cond(S)));
  if(eleg.length) return eleg[0];
  // epílogo esgotado: a despedida
  if(S.mandato >= 3) return {
    id:"m3-fim", tipo:"filler", quem:"O Legado", titulo:"A cidade depois de você",
    momento:{img:"gabinete-vazio.jpg", emoji:"📦", legenda:"O gabinete na última sexta-feira. As caixas são suas; as instituições, da cidade."},
    texto:"O mandato acaba na sexta-feira. Na segunda, a cidade acorda e funciona — ou não — por causa do que você deixou de pé. É assim que se mede um governo: pelo dia em que ele vai embora.",
    opcoes:[{rotulo:"Ver o que você deixou", custo:"", ef:{}, fimLegado:true, destaque:true}]
  };
  // sem carta elegível: semanas comuns até as consequências agendadas vencerem; eleição ao fim de cada mandato
  if(S.semana < 14*S.mandato) return {
    id:"filler", tipo:"filler", quem:"A cidade", titulo:"Uma semana comum",
    texto: FILLER_TEXTOS[S.semana % FILLER_TEXTOS.length],
    opcoes:[{rotulo:"Seguir a semana", custo:"", ef:{}}]
  };
  return S.fim ? null : DECK.find(c=>c.tipo==="eleicao");
}

const IMG_B64 = {}; // produção: imagens em assets/jogo/ (cacheadas pelo Service Worker)
function momentoHtml(m){
  if(!m) return "";
  const src = IMG_B64[m.img] || ("assets/jogo/" + m.img);
  return `<figure class="momento">
    <img src="${src}" alt="" onload="this.parentElement.classList.add('tem-img')" onerror="this.remove()">
    <div class="fallback">${m.emoji}<span>carregando imagem…</span></div>
    <figcaption>${m.legenda}</figcaption>
  </figure>`;
}
function renderCarta(){
  const c = cartaAtual();
  const el = $("carta");
  if(!c){ renderFim(); return; }
  el.className = "carta " + (c.tipo||"");
  const ops = c.opcoes.filter(o=>!(o.abrirAula && c.marcaVista && S.flags[c.marcaVista] && c.tipo!=="crise"));
  el.innerHTML = `
    <div class="quem">${c.quem}</div>
    <h2>${c.titulo}</h2>
    ${momentoHtml(c.momento)}
    <p>${c.texto}</p>
    <div class="opcoes">${ops.map((o,i)=>{
      const semLucidez = o.lucidez && S.lucidez < o.lucidez;
      const inativo = semLucidez || o.bloqueada;
      return `<button class="opcao${o.destaque?" destaque":""}" data-i="${i}" ${inativo?"disabled":""}>
        ${o.rotulo}${o.custo?`<span class="custo">${o.custo}${semLucidez?" · você ainda não tem Lucidez suficiente":""}</span>`:""}
      </button>`;}).join("")}
    </div>`;
  el.querySelectorAll(".opcao").forEach(b=>b.addEventListener("click",()=>escolher(c, ops[b.dataset.i])));
}

function escolher(carta, op){
  // guardas ANTES de qualquer efeito (ordem importa: nada aplica duas vezes)
  if(op.bloqueada) return;
  if(op.vitalicio){ iniciarVitalicio(); return; }
  if(op.duelo){ if(DUELO_PENDENTE) iniciarDuelo(DUELO_PENDENTE); return; }
  if(op.abrirAula){ S.flags[carta.marcaVista||"criseVista"] = true; renderAula(carta.aulaId||"precos"); return; }
  sfx("click");
  aplicar(op.ef||{});
  agendar(op.ag);
  if(op.news) noticia(op.news[0], op.news[1]);
  if(op.aoEscolher) op.aoEscolher(S);
  if(carta.tipo==="prometedor" && (op.ef&&op.ef.aprovBase)) S.caiuNaTentacao = true;
  if(op.semSemana){ salvar(); renderTudo(); return; } // decisão que não consome semana (ex.: perk)
  if(carta.tipo==="crise") S.flags[carta.marcaVista||"criseVista"] = true;
  if(op.fimLegado){ fecharLegado(); return; }
  if(op.eleicao){ apurarEleicao(); return; }
  if(carta.tipo!=="crise" && carta.tipo!=="filler") S.jogadas.push(carta.id);
  passarSemana();
  salvar();
  renderTudo();
}

/* ---------- aula ---------- */
function renderAula(aulaId){
  const AULA = AULAS[aulaId] || AULAS.precos;
  S.aulaAtual = aulaId;
  const el = $("carta");
  el.className = "carta aula-carta";
  let quizHtml = AULA.quiz.map((q,qi)=>`
    <div class="quiz" data-q="${qi}">
      <p>${qi+1}. ${q.p}</p>
      ${q.ops.map((o,oi)=>`<button class="opcao" data-o="${oi}">${o}</button>`).join("")}
    </div>`).join("");
  el.innerHTML = `
    <div class="quem">📚 Aula · ${AULA.fonte}</div>
    <h2>${AULA.titulo}</h2>
    <div class="aula-conteudo">${AULA.paragrafos.map(p=>`<p>${p}</p>`).join("")}${quizHtml}</div>`;
  let acertos = 0, respondidas = 0;
  el.querySelectorAll(".quiz").forEach(qEl=>{
    const qi = +qEl.dataset.q;
    qEl.querySelectorAll(".opcao").forEach(b=>b.addEventListener("click",()=>{
      if(qEl.dataset.ok) return;
      qEl.dataset.ok = "1"; respondidas++;
      const certa = AULA.quiz[qi].certa;
      qEl.querySelectorAll(".opcao").forEach((bb,oi)=>{
        if(oi===certa) bb.classList.add("certa");
        else if(+b.dataset.o===oi && oi!==certa) bb.classList.add("errada");
      });
      if(+b.dataset.o===certa) acertos++;
      if(respondidas===AULA.quiz.length){
        setTimeout(()=>concluirAula(acertos, AULA), 900);
      }
    }));
  });
}
function concluirAula(acertos, AULA){
  const ganho = acertos===AULA.quiz.length ? AULA.recompensa : Math.max(1, acertos);
  S.lucidez += ganho;
  if(AULA.instalaPainel && !S.painelEconomico){
    S.painelEconomico = true;
    noticia(`Você entendeu a engrenagem. +${ganho} de Lucidez — e o painel econômico foi instalado: agora você ENXERGA abastecimento e moradia.`,"boa");
  } else {
    noticia(`Mais uma engrenagem exposta. +${ganho} de Lucidez.`,"boa");
  }
  sfx("ding");
  xpApp(40, "xpAula_"+S.aulaAtual);
  passarSemana();
  salvar();
  renderTudo();
}

/* ---------- eleição e fim ---------- */
function apurarEleicao(){
  const r = realidade(S);
  // Voto Consciente na grade: o eleitor confere a gestão real por conta própria — mesmo sem imprensa livre
  const pesoReal = (S.imprensaLivre ? 0.45 : 0) + (discAtiva("voto") ? 0.20 : 0);
  const score = Math.round(S.aprovacao*(1-pesoReal) + r*pesoReal);
  const venceu = score >= 50;
  if(S.modo==="vitalicio"){
    if(!venceu){ gameOverVitalicio("urnas"); return; }
    S.flags["elei_"+S.semana] = true;
    S.mandato++;
    sfx("ding");
    noticia(`Reeleito com ${score}% — mandato ${S.mandato}. O Prometedor anotou cada fraqueza sua.`,"boa");
    passarSemana(); salvar(); renderTudo(); return;
  }
  // vitória no 1º mandato: o jogo continua — a posse do 2º vem com as contas do 1º
  if(venceu && S.mandato === 1){
    S.mandato = 2;
    xpApp(60, "xpEleicao1");
    noticia(`Reeleito com ${score}% dos votos. O segundo mandato começa agora — e as promessas do primeiro vêm junto.`,"boa");
    passarSemana();
    salvar();
    renderTudo();
    return;
  }
  let selo, desc;
  if(venceu && !S.caiuNaTentacao && S.escolaridade>=35 && r>=62){ selo="O Estadista"; desc="Dois mandatos, nenhuma promessa fácil, uma cidade educada e próspera. É disso que a história se lembra."; }
  else if(venceu && !S.caiuNaTentacao){ selo="A Cidade Que Nunca Caiu"; desc="Você recusou todas as promessas fáceis — e venceu mesmo assim. Pouquíssimos conseguem."; }
  else if(venceu && S.flags.prometeuMais && !S.flags.reformou2){ selo="Vitória com Fatura"; desc="Você venceu prometendo o impagável. A conta continua na mesa."; }
  else if(venceu && (S.flags.reformou || S.flags.reformou2)){ selo="O Reconstrutor"; desc="Você caiu, entendeu, desfez e reconstruiu. É a história que vale ser contada."; }
  else if(venceu){ selo="Dois Mandatos"; desc="A cidade te manteve no cargo até o fim. O que você deixou de pé fala por você."; }
  else { selo="Derrotado nas urnas"; desc="O Prometedor venceu. Da janela, você vai assistir ao que ele faz com a sua cidade."; }
  if(venceu){
    // vitória final: entra o Epílogo — O Legado (o que fica de pé sem você)
    xpApp(selo==="O Estadista" ? 150 : 80, "xpFim");
    S.seloFinal = {selo, desc, score, r};
    S.mandato = 3;
    noticia(`Vitória final com ${score}% dos votos. A Constituição não permite um terceiro mandato — agora só importa o que fica de pé sem você.`,"boa");
    passarSemana();
    salvar();
    renderTudo();
    return;
  }
  S.fim = {venceu, selo, desc, score, r, mandato:S.mandato};
  salvar();
  renderTudo();
}
function fecharLegado(){
  const f = S.seloFinal || {selo:"Dois Mandatos", desc:"", score:0, r:realidade(S)};
  const legados = ["leg_escola","leg_imprensa","leg_contas","leg_concessao","leg_lei"].filter(k=>S.flags[k]);
  xpApp(50, "xpLegado");
  if(!META.campanhaVencida){ META.campanhaVencida = true; salvarMeta(); }
  S.fim = {venceu:true, selo:f.selo, desc:f.desc, score:f.score, r:realidade(S), mandato:2, legados};
  salvar();
  renderTudo();
}
function renderFim(){
  const f = S.fim || {venceu:false, selo:"Fim do protótipo", desc:"", score:0, r:realidade(S)};
  const el = $("carta");
  if(f.modo==="vitalicio"){
    el.className = "carta crise";
    const cen = CENARIOS.find(c=>c.id===S.cenario) || CENARIOS[0];
    // todo fim de run gera um convite JOGÁVEL: mesma cidade, mesmas cartas (duelo P2P, zero servidor)
    const meuNick = nickLimpo(localStorage.getItem("jogo_nick")||"") || "Um prefeito";
    const desafioUrl = linkDuelo({ s:S.seed, c:S.cenario||"nova", p:f.score, n:meuNick,
      r:f.r, b:Math.min(14, (S.lotes||[]).filter(l=>l.tipo!=="vazio").length) }); // snapshot: vira cidade-fantasma no horizonte do amigo
    const zap = encodeURIComponent(f.duelo
      ? (f.duelo.venceu
          ? `⚔️ Respondi seu desafio e VENCI: ${f.score} × ${f.duelo.deles} semanas na ${cen.emoji} ${cen.nome}. Revanche? Mesma cidade: ${desafioUrl}`
          : f.duelo.empate
            ? `⚔️ Empate: ${f.score} × ${f.duelo.deles} semanas na ${cen.emoji} ${cen.nome}. Desempata? ${desafioUrl}`
            : `⚔️ Você venceu essa: ${f.score} × ${f.duelo.deles} semanas na ${cen.emoji} ${cen.nome}. A revanche vem: ${desafioUrl}`)
      : `🏛️ Sobrevivi ${f.score} semanas como prefeito da ${cen.emoji} ${cen.nome} (Cidade da Semana #${S.seed}) no Cidade Livre${f.novoRecorde?" — RECORDE novo":""}. Duvido aguentar mais que eu — mesma cidade, mesmas cartas: ${desafioUrl}`);
    el.innerHTML = `
      <div class="quem">Fim de governo · ${f.causa==="urnas"?"derrota nas urnas":f.causa==="falencia"?"colapso fiscal":"impeachment"}</div>
      <h2>Você caiu na semana ${f.score+1}.</h2>
      ${momentoHtml({img:"derrota.jpg", emoji:"🏛️", legenda:"Toda queda tem uma lição. A próxima run começa mais sábia."})}
      <p>${f.desc}</p>
      ${f.duelo? `<div class="selo"><div class="nome">${f.duelo.venceu?"⚔️ Duelo vencido":f.duelo.empate?"⚔️ Duelo empatado":"⚔️ Duelo perdido"}</div>
        <div class="desc">Você <b>${f.score}</b> × <b>${f.duelo.deles}</b> ${f.duelo.nick} · ${cen.emoji} ${cen.nome} #${S.seed}</div></div>`:""}
      <div class="selo"><div class="nome">${f.score} semanas no poder</div>
        <div class="desc">${f.novoRecorde? "🏆 NOVO RECORDE" : `Recorde: ${f.recorde} semanas`} · prosperidade final ${f.r}%</div></div>
      <div id="rankBloco">
        ${f.publicado
          ? `<div id="rankLista" class="recap" style="text-align:center">Carregando ranking…</div>`
          : `<div style="display:flex; gap:8px; margin:4px 0">
               <input id="rankNick" maxlength="20" placeholder="Seu apelido no ranking" value="${nickLimpo(localStorage.getItem('jogo_nick')||'')}"
                 style="flex:1; font:inherit; font-size:14px; padding:11px 14px; border-radius:12px; border:1px solid var(--borda-forte); background:var(--painel-2); color:var(--tinta)">
               <button class="opcao" id="btnPublicar" type="button" style="flex:0 0 auto">🏆 Publicar</button>
             </div>
             <div class="recap" style="text-align:center; font-size:11px">Ranking da ${(CENARIOS.find(c=>c.id===S.cenario)||CENARIOS[0]).nome} · semana #${S.seed} · apelido público, sem dados pessoais</div>`}
      </div>
      <div class="opcoes">
        <a class="opcao destaque" style="text-decoration:none;text-align:center" target="_blank" rel="noopener" href="https://wa.me/?text=${zap}">${f.duelo? "⚔️ Responder no WhatsApp" : "⚔️ Desafiar um amigo — mesma cidade"}</a>
        ${f.duelo && !f.duelo.venceu? `<button class="opcao" id="btnDueloDeNovo" type="button">⚔️ Tentar o duelo de novo</button>`:""}
        <button class="opcao" id="btnRunDeNovo" type="button">Tentar de novo — mesma Cidade da Semana</button>
        <button class="opcao" id="btnVoltarCampanha" type="button">Voltar à campanha</button>
      </div>`;
    if(f.novoRecorde) sfx("recorde");
    document.getElementById("btnDueloDeNovo")?.addEventListener("click", ()=>iniciarDuelo({ s:S.seed, c:S.cenario||"nova", p:f.duelo.deles, n:f.duelo.nick, r:S.duelo?.r, b:S.duelo?.b }));
    $("btnRunDeNovo").addEventListener("click", iniciarVitalicio);
    $("btnVoltarCampanha").addEventListener("click", reiniciar);
    async function mostrarRanking(){
      const alvo = document.getElementById("rankLista"); if(!alvo) return;
      try{
        const top = await buscarRanking(S.seed);
        const eu = playerId();
        alvo.innerHTML = top.length
          ? `<b>🏆 Top da semana</b><br>` + top.map((l,i)=>
              `${i+1}º ${l.player_id===eu?"<b>":""}${nickLimpo(l.nick)} — ${l.score} sem${l.player_id===eu?" ← você</b>":""}`
            ).join("<br>")
          : "Seja o primeiro no ranking desta cidade!";
      }catch(e){ alvo.textContent = "Ranking indisponível no momento — sua pontuação está guardada."; }
    }
    if(f.publicado){ mostrarRanking(); }
    else document.getElementById("btnPublicar")?.addEventListener("click", async ()=>{
      const nome = nickLimpo(document.getElementById("rankNick").value);
      if(nome.length<2){ document.getElementById("rankNick").focus(); return; }
      localStorage.setItem("jogo_nick", nome);
      document.getElementById("btnPublicar").disabled = true;
      await enviarScore({nick:nome, cenario:S.cenario||"nova", seed:S.seed, score:f.score, prosperidade:f.r});
      S.fim.publicado = true; salvar();
      document.getElementById("rankBloco").innerHTML = `<div id="rankLista" class="recap" style="text-align:center">Carregando ranking…</div>`;
      sfx("ding"); mostrarRanking();
    });
    return;
  }
  el.className = "carta " + (f.venceu?"":"crise");
  el.innerHTML = `
    <div class="quem">Apuração encerrada</div>
    <h2>${f.legados? "Oito anos. Missão cumprida." : f.venceu? "Você foi reeleito." : "Você perdeu a eleição."}</h2>
    ${momentoHtml(f.venceu
      ? {img:"vitoria.jpg", emoji:"🏛️ 🌅", legenda:"A Rua Principal na manhã seguinte: comércio abrindo, obra retomada, a cidade seguindo em frente."}
      : {img:"derrota.jpg", emoji:"🏛️ 🌧️", legenda:"Da janela da prefeitura, você assiste ao comício da vitória do Prometedor."})}
    <div class="selo"><div class="nome">${f.selo}</div><div class="desc">${f.desc}</div></div>
    <p class="recap">
      Votos: <b>${f.score}%</b> · Prosperidade real: <b>${f.r}%</b> · Aprovação: <b>${S.aprovacao}%</b><br>
      Caixa final: <b>${S.caixa}</b> · Escolaridade: <b>${S.escolaridade}%</b> · Corrupção: <b>${S.corrupcao}</b><br>
      Imprensa: <b>${S.imprensaLivre? "livre" : "comprada"}</b> · Lucidez restante: <b>${S.lucidez}</b>
    </p>
    ${!f.venceu? `<p>O Prometedor assume na segunda-feira. As primeiras medidas: congelamento geral de preços, vales em dobro e o fechamento do jornal.</p>`:""}
    ${f.legados && f.legados.length? `<p class="recap" style="text-align:center">Instituições que ficaram de pé: <b>${f.legados.length} de 5</b><br>${
      [["leg_escola","🏫 Escola Técnica"],["leg_imprensa","📰 Estatuto da Imprensa"],["leg_contas","🔍 Contas Abertas"],["leg_concessao","🛣️ Concessão das Vias"],["leg_lei","📜 Lei da Cidade Livre"]]
      .filter(x=>f.legados.includes(x[0])).map(x=>x[1]).join(" · ") || "nenhuma"
    }</p>`:""}
    <div class="opcoes">
      ${f.venceu? `<a class="opcao destaque" style="text-decoration:none;text-align:center" target="_blank" rel="noopener"
        href="https://wa.me/?text=${encodeURIComponent(`🏛️ Governei a Cidade Livre por 8 anos e terminei como “${f.selo}”${f.legados&&f.legados.length?` — deixando ${f.legados.length} instituições de pé`:""}. Aguenta governar melhor? https://jogo.escolaliberal.com.br`)}"
        >Desafiar um amigo no WhatsApp</a>`:""}
      <button class="opcao" id="btnDeNovo">Jogar de novo${f.venceu?"":" — disputar a próxima eleição"}</button>
    </div>`;
  $("btnDeNovo").addEventListener("click", reiniciar);
}

function reiniciar(){
  localStorage.removeItem(SAVE_KEY);
  S = estadoInicial();
  noticia("Novo mandato. A cidade te observa.","");
  salvar();
  renderTudo();
}

function renderTudo(){ renderMedidores(); renderCidade(); renderNoticias(); if(DUELO_PENDENTE || !S.fim) renderCarta(); else renderFim(); drenarFlutuas(); }
$("btnReiniciar").addEventListener("click", ()=>{ if(confirm("Recomeçar o mandato do zero?")) reiniciar(); });
function uiSfx(){ $("btnSfx").textContent = localStorage.getItem("jogo_sfx")==="off" ? "🔇" : "🔊"; }
$("btnSfx").addEventListener("click", ()=>{
  const off = localStorage.getItem("jogo_sfx")==="off";
  localStorage.setItem("jogo_sfx", off ? "on" : "off");
  uiSfx(); if(off) sfx("ding");
});
uiSfx();

if(S.noticias.length===0) noticia("Primeiro dia de mandato. A cidade te observa.","");
renderTudo();
drenarFilaScores(); // scores presos offline sobem quando a rede volta
</script>
</body>
</html>
